<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数量入力 3案プレビュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ede8df; --body:#141928; --display-bg:#0a0e1a; --gold:#c8a84b; --gold-light:#e2c97e;
    --btn-num:#1c2338; --btn-fn:#2a3050; --text-num:#d8d0c4; --text-fn:#9ba8c0; --radius:3px;
    --in:#6fbf8b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);font-family:'Zen Maru Gothic',sans-serif;padding:16px;color:var(--text-num);}
  h1{text-align:center;font-size:1rem;color:#8a7a5a;letter-spacing:.2em;margin-bottom:4px;}
  .lead{text-align:center;font-size:.8rem;color:#8a7a5a;margin-bottom:18px;}
  .grid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:flex-start;}
  .phone{width:300px;background:var(--body);border-radius:14px;padding:16px;box-shadow:0 20px 40px rgba(14,18,30,.35);}
  .tag{display:inline-block;font-size:.72rem;color:var(--gold-light);letter-spacing:.08em;margin-bottom:4px;}
  .desc{font-size:.74rem;color:var(--text-fn);line-height:1.5;margin-bottom:12px;min-height:40px;}
  .display{background:var(--display-bg);border-radius:4px;padding:10px 14px;margin-bottom:12px;min-height:70px;
    display:flex;flex-direction:column;justify-content:flex-end;box-shadow:inset 0 2px 8px rgba(0,0,0,.6);}
  .d-expr{font-family:'DM Mono',monospace;font-size:.72rem;color:rgba(200,168,75,.55);margin-bottom:6px;}
  .d-row{display:flex;align-items:flex-end;justify-content:space-between;}
  .d-dir{font-size:.82rem;color:var(--in);background:rgba(111,191,139,.18);padding:1px 8px;border-radius:3px;}
  .d-main{font-family:'DM Mono',monospace;font-size:2rem;color:var(--gold-light);line-height:1;}
  .dir-toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}
  .dir-btn{height:42px;border:none;border-radius:var(--radius);background:var(--btn-fn);color:var(--text-fn);font-family:inherit;font-size:.9rem;}
  .dir-btn.sel{background:var(--in);color:#0c1a12;}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}
  .tile{min-height:44px;border:1px solid transparent;border-radius:var(--radius);background:var(--btn-num);color:var(--text-num);
    text-align:left;padding:6px 8px;font-family:inherit;}
  .tile.sel{border-color:var(--gold);}
  .tile .c{font-family:'DM Mono',monospace;color:var(--gold-light);font-size:.85rem;display:block;}
  .tile .n{font-size:.7rem;color:var(--text-fn);}
  .commit{width:100%;height:48px;border:none;border-radius:var(--radius);background:var(--gold);color:var(--body);font-family:inherit;font-weight:700;font-size:1rem;margin-top:4px;}
  .btn{border:none;border-radius:var(--radius);font-family:inherit;background:var(--btn-num);color:var(--text-num);}
  .fn{background:var(--btn-fn);color:var(--text-fn);}

  /* 案1 compact numpad */
  .numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
  .numpad.compact .btn{height:42px;font-size:1.05rem;}
  .numpad.normal .btn{height:56px;font-size:1.3rem;}

  /* 案3 steppers */
  .stepwrap{margin-bottom:10px;}
  .steprow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px;}
  .steprow .btn{height:40px;font-size:.95rem;}
  .step-minus{background:#3a2630;color:#e9b6ab;}
  .step-plus{background:#1c2f24;color:#9be0b4;}
  .qtyfield{width:100%;height:48px;text-align:center;border:1px solid var(--gold);border-radius:4px;background:var(--display-bg);
    color:var(--gold-light);font-family:'DM Mono',monospace;font-size:1.4rem;margin-bottom:8px;}
  .hint{font-size:.7rem;color:var(--text-fn);margin-bottom:8px;}
  .reveal-note{font-size:.74rem;color:var(--gold-light);text-align:center;padding:18px 8px;border:1px dashed var(--gold);border-radius:6px;margin-bottom:10px;}
</style>
</head>
<body>
<h1>数量入力 3案プレビュー</h1>
<div class="lead">最大10000まで入力できる前提。実際にボタンを押して試せます</div>

<div class="grid">

  <!-- 案1 -->
  <div class="phone">
    <span class="tag">案1（おすすめ）</span>
    <div class="desc">テンキーを少しコンパクトに。今の操作感のまま占有面積を縮小。5桁もそのまま打てる。</div>
    <div class="display"><div class="d-expr">A-001 コーラ</div>
      <div class="d-row"><span class="d-dir">⬇ 入庫</span><span class="d-main" id="m1">0</span></div></div>
    <div class="dir-toggle"><button class="dir-btn sel">⬇ 入庫</button><button class="dir-btn">⬆ 出庫</button></div>
    <div class="tiles"><button class="tile sel"><span class="c">A-001</span><span class="n">コーラ</span></button>
      <button class="tile"><span class="c">B-002</span><span class="n">お茶</span></button></div>
    <div class="numpad compact" data-target="m1">
      <button class="btn">7</button><button class="btn">8</button><button class="btn">9</button>
      <button class="btn">4</button><button class="btn">5</button><button class="btn">6</button>
      <button class="btn">1</button><button class="btn">2</button><button class="btn">3</button>
      <button class="btn fn" data-k="c">C</button><button class="btn">0</button><button class="btn fn" data-k="b">⌫</button>
    </div>
    <button class="commit">✓ 記録する</button>
  </div>

  <!-- 案2 -->
  <div class="phone">
    <span class="tag">案2</span>
    <div class="desc">最初は品番タイルを広く表示。品番をタップするとテンキーが現れる流れ。</div>
    <div class="display"><div class="d-expr" id="expr2">品番を選択してください</div>
      <div class="d-row"><span class="d-dir">⬇ 入庫</span><span class="d-main" id="m2">0</span></div></div>
    <div class="dir-toggle"><button class="dir-btn sel">⬇ 入庫</button><button class="dir-btn">⬆ 出庫</button></div>
    <div class="tiles" id="tiles2">
      <button class="tile" data-pick="A-001 コーラ"><span class="c">A-001</span><span class="n">コーラ</span></button>
      <button class="tile" data-pick="B-002 お茶"><span class="c">B-002</span><span class="n">お茶</span></button>
      <button class="tile" data-pick="C-003 水"><span class="c">C-003</span><span class="n">水</span></button>
      <button class="tile" data-pick="D-004 パン"><span class="c">D-004</span><span class="n">パン</span></button>
    </div>
    <div id="pad2hidden" class="reveal-note">↑ 品番をタップするとここにテンキーが出ます</div>
    <div id="pad2" class="numpad compact" data-target="m2" hidden>
      <button class="btn">7</button><button class="btn">8</button><button class="btn">9</button>
      <button class="btn">4</button><button class="btn">5</button><button class="btn">6</button>
      <button class="btn">1</button><button class="btn">2</button><button class="btn">3</button>
      <button class="btn fn" data-k="c">C</button><button class="btn">0</button><button class="btn fn" data-k="b">⌫</button>
    </div>
    <button class="commit">✓ 記録する</button>
  </div>

  <!-- 案3 -->
  <div class="phone">
    <span class="tag">案3</span>
    <div class="desc">＋／−の早送りボタン中心。よく使う小さい数は最速。数欄をタップすれば直接入力も可（1万もOK）。</div>
    <div class="display"><div class="d-expr">A-001 コーラ</div>
      <div class="d-row"><span class="d-dir">⬇ 入庫</span><span class="d-main" id="m3">0</span></div></div>
    <div class="dir-toggle"><button class="dir-btn sel">⬇ 入庫</button><button class="dir-btn">⬆ 出庫</button></div>
    <div class="tiles"><button class="tile sel"><span class="c">A-001</span><span class="n">コーラ</span></button>
      <button class="tile"><span class="c">B-002</span><span class="n">お茶</span></button></div>
    <input class="qtyfield" id="f3" type="number" inputmode="numeric" value="0">
    <div class="hint">欄を直接タップ＝キーボードで入力（〜10000）</div>
    <div class="stepwrap">
      <div class="steprow">
        <button class="btn step-plus" data-add="1">＋1</button>
        <button class="btn step-plus" data-add="10">＋10</button>
        <button class="btn step-plus" data-add="100">＋100</button>
      </div>
      <div class="steprow">
        <button class="btn step-minus" data-add="-1">−1</button>
        <button class="btn step-minus" data-add="-10">−10</button>
        <button class="btn step-minus" data-add="-100">−100</button>
      </div>
    </div>
    <button class="commit">✓ 記録する</button>
  </div>

</div>

<script>
  // 案1・案2 テンキー
  document.querySelectorAll('.numpad').forEach(pad => {
    const target = document.getElementById(pad.dataset.target);
    pad.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      let v = target.textContent;
      if (b.dataset.k === 'c') v = '0';
      else if (b.dataset.k === 'b') v = v.length > 1 ? v.slice(0, -1) : '0';
      else { if (v === '0') v = b.textContent; else if (v.length < 5) v += b.textContent; }
      target.textContent = v;
    });
  });
  // 案2 品番タップでテンキー表示
  document.getElementById('tiles2').addEventListener('click', e => {
    const t = e.target.closest('[data-pick]'); if (!t) return;
    document.querySelectorAll('#tiles2 .tile').forEach(x => x.classList.remove('sel'));
    t.classList.add('sel');
    document.getElementById('expr2').textContent = t.dataset.pick;
    document.getElementById('pad2hidden').hidden = true;
    document.getElementById('pad2').hidden = false;
  });
  // 案3 ステッパー
  const f3 = document.getElementById('f3'), m3 = document.getElementById('m3');
  function sync3(){ m3.textContent = (parseInt(f3.value,10) || 0); }
  document.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
    let v = (parseInt(f3.value,10) || 0) + parseInt(b.dataset.add,10);
    if (v < 0) v = 0; if (v > 10000) v = 10000;
    f3.value = v; sync3();
  }));
  f3.addEventListener('input', sync3);
</script>
</body>
</html>
